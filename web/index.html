<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      A restrictive CSP: the app talks to the cluster through the Go backend
      over Wails' IPC bridge, never over the network from the webview, so no
      remote origin needs to be reachable from here.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:;"
    />
    <!--
      The webview never requests a favicon, but the dev server opened in a
      browser does — and podsteer.com will serve the same files. SVG first for
      anything modern, a 32px PNG for anything not, and the tile for an iOS
      home-screen bookmark.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>PodSteer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="PodSteer">
  <title>PodSteer</title>

  <!--
    A favicon is a 16-pixel problem, so it is drawn as one rather than scaled
    down from the full mark.

    The hexagon is gone: at 16px its 6.5-unit stroke lands on two-thirds of a
    pixel and turns the whole mark into grey mush. What survives is the pulse —
    the half that carries the meaning — on the tile that carries the brand.
  -->
  <defs>
    <linearGradient id="podsteer-favicon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#1557b0"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#podsteer-favicon-gradient)"/>
  <path d="M6 17h4l3-7 3.5 13 3-6h6.5"
        fill="none" stroke="#ffffff" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>

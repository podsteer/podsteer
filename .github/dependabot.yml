version: 2

updates:
  # client-go moves fast and its releases track Kubernetes minors, so this is
  # the ecosystem most likely to need attention.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: develop
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: develop
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # svelte-check declares `typescript@^5.0.0 || ^6.0.0`, so TypeScript 7 —
      # the native port — cannot be installed without breaking type-checking.
      # Remove this entry once svelte-check widens its peer range; until then
      # Dependabot would reopen the same unmergeable PR every week.
      - dependency-name: typescript
        versions: ['>=7.0.0']
    groups:
      # Svelte, Vite and Tailwind release in step with their own plugins;
      # separate PRs for each would not build.
      frontend-toolchain:
        patterns:
          - 'svelte*'
          - '@sveltejs/*'
          - 'vite'
          - 'tailwindcss'
          - '@tailwindcss/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: 'chore(deps)'

version: 2

updates:
  # client-go moves fast and its releases track Kubernetes minors, so this is
  # the ecosystem most likely to need attention.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: develop
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: develop
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Svelte, Vite and Tailwind release in step with their own plugins;
      # separate PRs for each would not build.
      frontend-toolchain:
        patterns:
          - 'svelte*'
          - '@sveltejs/*'
          - 'vite'
          - 'tailwindcss'
          - '@tailwindcss/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: 'chore(deps)'

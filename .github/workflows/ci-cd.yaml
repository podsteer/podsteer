name: CI/CD Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc-[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-dev-[0-9]+'
  pull_request:
    branches:
      - 'main'
      - 'develop'

# A desktop application has no environment to deploy into, so the tag tiers
# mean something different here than they do in a ParliTrack service:
#
#   v1.2.3-dev-N   development build — artefacts kept for 14 days, no release
#   v1.2.3-rc-N    release candidate — a GitHub pre-release
#   v1.2.3         production        — a public GitHub release
#
# The branch model and the gate below are unchanged from the service standard.

env:
  GO_VERSION_FILE: go.mod
  NODE_VERSION: '24'
  WAILS_VERSION: v2.15.0
  # Ubuntu 24.04 ships webkit2gtk 4.1 only; Wails still defaults to 4.0, so the
  # Linux build has to opt in explicitly or cgo fails to find the package.
  LINUX_TAGS: webkit2_41

jobs:
  quality:
    name: Vet, Test, Lint
    runs-on: ubuntu-latest
    # NO `if:` HERE, AND THAT IS THE WHOLE POINT.
    #
    # Every job below declares `needs: quality`, and a SKIPPED dependency skips
    # its dependents. Gate this to branches only and the tag-driven release jobs
    # silently stop — not a failure, no error, just nothing published.
    #
    # This is a release GATE, not a report.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The embed directory is tracked but empty on a clean checkout, and
      # `//go:embed all:dist` will not compile without an index.html inside it.
      # Building the frontend first is therefore a prerequisite for `go build`,
      # not an optional extra.
      - name: Install Frontend Dependencies
        run: npm --prefix web ci

      - name: Build Frontend
        run: npm --prefix web run build

      - name: Type-check Frontend
        run: npm --prefix web run check

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race here rather than in a separate job: the Session and the client
      # cache are both shared mutable state reached from concurrent UI calls,
      # which is exactly the class of bug a plain `go test` will not see.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # Inside the gate rather than in a job of its own, deliberately. A
      # separate job would need `needs: quality` and could be skipped
      # independently; here a licence violation stops the release the same way
      # a failing test does.
      #
      # Ordering matters: this must follow `go build ./...` so the module cache
      # is warm, and the frontend build so the embed directory exists — the
      # generator asks `go list` what the binary links, across all three
      # release platforms.
      - name: Verify Licence Policy And Notices
        run: |
          node build/generate-notices.mjs
          if ! git -c core.fileMode=false diff --quiet -- app/adapters/notices/notices.json; then
            echo "::error::notices.json is out of date. Run 'make notices' and commit the result."
            git -c core.fileMode=false diff --stat -- app/adapters/notices/notices.json
            exit 1
          fi
          echo "Licence policy satisfied; notices.json matches the dependency set."

      - name: Generate SBOM
        run: node build/generate-sbom.mjs

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: build/bin/sbom/k8sense.cdx.json
          retention-days: 14
          if-no-files-found: error

  bindings:
    name: Bindings Up To Date
    runs-on: ubuntu-latest
    needs: quality
    # The generated TypeScript in web/src/lib/wailsjs is committed so that a
    # fresh clone type-checks and IDEs resolve imports without anyone having
    # run Wails. That only stays honest if CI proves it matches the Go it was
    # generated from — otherwise a changed DTO ships a stale frontend contract
    # and nothing notices until runtime.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # Deliberately `make bindings` rather than calling Wails directly: the
      # target also stubs the embed directory (generation compiles AND RUNS the
      # app, which will not start without an embedded bundle) and normalises the
      # generated files' permission bits. Duplicating that here would let the
      # two drift apart, and this job exists precisely to catch drift.
      - name: Regenerate Bindings
        run: make bindings

      - name: Fail If Bindings Drifted
        run: |
          # core.fileMode=false so a permission-bit difference between runner
          # and developer machine cannot fail a check about generated content.
          if ! git -c core.fileMode=false diff --quiet -- web/src/lib/wailsjs; then
            echo "::error::Generated bindings are out of date. Run 'make bindings' and commit the result."
            git -c core.fileMode=false diff --stat -- web/src/lib/wailsjs
            exit 1
          fi
          echo "Bindings match the bound Go types."

  package:
    name: Package (${{ matrix.name }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform's toolchain breaking should not hide whether the others
      # still package; the release job's `needs` still blocks on all of them.
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than two builds: it is the single
          # URL a Homebrew cask needs, and it works on Intel Macs, which a
          # runner-native arm64 build silently does not.
          - name: macos-universal
            runner: macos-latest
            artifact: k8sense-macos-universal
            platform: darwin/universal
          - name: windows-amd64
            runner: windows-latest
            artifact: k8sense-windows-amd64
          - name: linux-amd64
            runner: ubuntu-latest
            artifact: k8sense-linux-amd64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # Wails generates bindings by compiling and RUNNING the application, and
      # it does so before building the frontend. K8Sense refuses to start
      # without an embedded bundle, so on a clean checkout that first run exits
      # 1 and fails the build. Building the frontend here breaks the cycle; the
      # `-s` below then stops Wails repeating the work.
      - name: Build Frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Build Application
        if: runner.os != 'Linux'
        run: wails build -clean -trimpath -s ${{ matrix.platform && format('-platform {0}', matrix.platform) || '' }}

      # The bundle is renamed for the same reason the Makefile renames it: the
      # executable stays lowercase for PATHs, the bundle is what a person sees
      # in /Applications. Through a temporary name because the runner's disk is
      # case-insensitive.
      - name: Name The macOS Bundle
        if: runner.os == 'macOS'
        run: |
          if [ -d build/bin/k8sense.app ]; then
            mv build/bin/k8sense.app build/bin/.rename.app
            mv build/bin/.rename.app build/bin/K8Sense.app
          fi

      - name: Build Application (Linux)
        if: runner.os == 'Linux'
        run: wails build -clean -trimpath -s -tags ${{ env.LINUX_TAGS }}

      # Compress before upload so the macOS .app keeps its bundle structure and
      # its executable bit; actions/upload-artifact would otherwise flatten it
      # into an unopenable directory tree.
      - name: Archive Artifact
        shell: bash
        run: |
          cd build/bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../../${{ matrix.artifact }}.zip ./*
          else
            zip -r -y ../../${{ matrix.artifact }}.zip ./*
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [quality, bindings, package]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev-')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The SBOM is built once, in the gate, and describes the release rather
      # than any one platform's binary — so it is named for the tag here
      # instead of being regenerated per platform.
      # Artifacts are uploaded under stable names so the matrix does not need
      # the tag; the release is where they gain their version, in one place.
      - name: Version The Release Assets
        run: |
          version="${{ github.ref_name }}"
          mv artifacts/k8sense.cdx.json "artifacts/k8sense_${version}_sbom.cdx.json"
          for f in artifacts/k8sense-*.zip; do
            [ -e "$f" ] || continue
            platform=$(basename "$f" .zip | sed 's/^k8sense-//')
            mv "$f" "artifacts/k8sense_${version}_${platform}.zip"
          done
          ls -la artifacts/

      # A cask and a package manager both need a checksum they did not compute
      # themselves. Published as an asset so it can be fetched without
      # downloading every binary to verify one.
      - name: Checksums
        run: |
          cd artifacts
          shasum -a 256 *.zip > "k8sense_${{ github.ref_name }}_checksums.txt"
          cat "k8sense_${{ github.ref_name }}_checksums.txt"

      # `gh` rather than a third-party release action: it ships on the runner,
      # needs no extra token plumbing, and keeps one less unpinned dependency
      # in the path that produces a signed-off artefact.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref_name }}" == *-rc-* ]]; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE=""
          fi
          gh release create "${{ github.ref_name }}" \
            artifacts/*.zip artifacts/*.cdx.json artifacts/*checksums.txt \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $PRERELEASE

name: CI/CD Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc-[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-dev-[0-9]+'
  pull_request:
    branches:
      - 'main'
      - 'develop'

# A desktop application has no environment to deploy into, so the tag tiers
# mean something different here than they do in a ParliTrack service:
#
#   v1.2.3-dev-N   development build — artefacts kept for 14 days, no release
#   v1.2.3-rc-N    release candidate — a GitHub pre-release
#   v1.2.3         production        — a public GitHub release
#
# The branch model and the gate below are unchanged from the service standard.

env:
  GO_VERSION_FILE: go.mod
  NODE_VERSION: '24'
  WAILS_VERSION: v2.15.0
  # Ubuntu 24.04 ships webkit2gtk 4.1 only; Wails still defaults to 4.0, so the
  # Linux build has to opt in explicitly or cgo fails to find the package.
  LINUX_TAGS: webkit2_41

jobs:
  quality:
    name: Vet, Test, Lint
    runs-on: ubuntu-latest
    # NO `if:` HERE, AND THAT IS THE WHOLE POINT.
    #
    # Every job below declares `needs: quality`, and a SKIPPED dependency skips
    # its dependents. Gate this to branches only and the tag-driven release jobs
    # silently stop — not a failure, no error, just nothing published.
    #
    # This is a release GATE, not a report.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The embed directory is tracked but empty on a clean checkout, and
      # `//go:embed all:dist` will not compile without an index.html inside it.
      # Building the frontend first is therefore a prerequisite for `go build`,
      # not an optional extra.
      - name: Install Frontend Dependencies
        run: npm --prefix web ci

      - name: Build Frontend
        run: npm --prefix web run build

      - name: Type-check Frontend
        run: npm --prefix web run check

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race here rather than in a separate job: the Session and the client
      # cache are both shared mutable state reached from concurrent UI calls,
      # which is exactly the class of bug a plain `go test` will not see.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

      # Inside the gate rather than in a job of its own, deliberately. A
      # separate job would need `needs: quality` and could be skipped
      # independently; here a licence violation stops the release the same way
      # a failing test does.
      #
      # Ordering matters: this must follow `go build ./...` so the module cache
      # is warm, and the frontend build so the embed directory exists — the
      # generator asks `go list` what the binary links, across all three
      # release platforms.
      - name: Verify Licence Policy And Notices
        run: |
          node build/generate-notices.mjs
          if ! git -c core.fileMode=false diff --quiet -- app/adapters/notices/notices.json; then
            echo "::error::notices.json is out of date. Run 'make notices' and commit the result."
            git -c core.fileMode=false diff --stat -- app/adapters/notices/notices.json
            exit 1
          fi
          echo "Licence policy satisfied; notices.json matches the dependency set."

      - name: Generate SBOM
        run: node build/generate-sbom.mjs

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: build/bin/sbom/podsteer.cdx.json
          retention-days: 14
          if-no-files-found: error

  bindings:
    name: Bindings Up To Date
    runs-on: ubuntu-latest
    needs: quality
    # The generated TypeScript in web/src/lib/wailsjs is committed so that a
    # fresh clone type-checks and IDEs resolve imports without anyone having
    # run Wails. That only stays honest if CI proves it matches the Go it was
    # generated from — otherwise a changed DTO ships a stale frontend contract
    # and nothing notices until runtime.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # Deliberately `make bindings` rather than calling Wails directly: the
      # target also stubs the embed directory (generation compiles AND RUNS the
      # app, which will not start without an embedded bundle) and normalises the
      # generated files' permission bits. Duplicating that here would let the
      # two drift apart, and this job exists precisely to catch drift.
      - name: Regenerate Bindings
        run: make bindings

      - name: Fail If Bindings Drifted
        run: |
          # core.fileMode=false so a permission-bit difference between runner
          # and developer machine cannot fail a check about generated content.
          if ! git -c core.fileMode=false diff --quiet -- web/src/lib/wailsjs; then
            echo "::error::Generated bindings are out of date. Run 'make bindings' and commit the result."
            git -c core.fileMode=false diff --stat -- web/src/lib/wailsjs
            exit 1
          fi
          echo "Bindings match the bound Go types."

  package:
    name: Package (${{ matrix.name }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    # OIDC, so Azure signing needs no long-lived credential in this repository.
    # `contents: read` is spelled out because naming any permission drops the
    # rest to none, and the default token would otherwise stay read-write.
    permissions:
      contents: read
      id-token: write
    # HOISTED TO THE JOB deliberately. A step's own `env:` block is not visible
    # to that same step's `if:`, so the "skip when unconfigured" conditions
    # below would silently evaluate against an empty string and every signing
    # step would be skipped forever — including after the secrets were added.
    #
    # NOTE THE `vars.` CONTEXT, NOT `secrets.`. The signing identity, key id and
    # issuer id are IDENTIFIERS, not credentials — they are printed inside the
    # certificate itself and are useless without the private key. Holding them
    # as secrets would mask them in the logs as `***`, which makes reading
    # codesign and notarytool output substantially harder for no security gain.
    # Only the .p12, its password and the .p8 are secrets.
    #
    # The GitHub-side names carry the PDS__ prefix; the job-local names do not,
    # because inside this workflow there is nothing to disambiguate from and the
    # shell below reads better without it.
    env:
      APPLE_SIGNING_IDENTITY: ${{ vars.PDS__APPLE_SIGNING_IDENTITY }}
      AZURE_CLIENT_ID: ${{ secrets.PDS__AZURE_CLIENT_ID }}
    strategy:
      # One platform's toolchain breaking should not hide whether the others
      # still package; the release job's `needs` still blocks on all of them.
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than two builds: it is the single
          # URL a Homebrew cask needs, and it works on Intel Macs, which a
          # runner-native arm64 build silently does not.
          - name: macos-universal
            runner: macos-latest
            artifact: podsteer-macos-universal
            platform: darwin/universal
          - name: windows-amd64
            runner: windows-latest
            artifact: podsteer-windows-amd64
          - name: linux-amd64
            runner: ubuntu-latest
            artifact: podsteer-linux-amd64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # Wails generates bindings by compiling and RUNNING the application, and
      # it does so before building the frontend. PodSteer refuses to start
      # without an embedded bundle, so on a clean checkout that first run exits
      # 1 and fails the build. Building the frontend here breaks the cycle; the
      # `-s` below then stops Wails repeating the work.
      - name: Build Frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Build Application
        if: runner.os != 'Linux'
        run: wails build -clean -trimpath -s ${{ matrix.platform && format('-platform {0}', matrix.platform) || '' }}

      # The bundle is renamed for the same reason the Makefile renames it: the
      # executable stays lowercase for PATHs, the bundle is what a person sees
      # in /Applications. Through a temporary name because the runner's disk is
      # case-insensitive.
      - name: Name The macOS Bundle
        if: runner.os == 'macOS'
        run: |
          if [ -d build/bin/podsteer.app ]; then
            mv build/bin/podsteer.app build/bin/.rename.app
            mv build/bin/.rename.app build/bin/PodSteer.app
          fi

      - name: Build Application (Linux)
        if: runner.os == 'Linux'
        run: wails build -clean -trimpath -s -tags ${{ env.LINUX_TAGS }}

      # --- macOS signing and notarisation -----------------------------------
      #
      # SKIPPED ENTIRELY UNTIL THE SECRETS EXIST, so this can be merged before
      # the Apple enrolment completes and a build on an unconfigured fork still
      # produces an (unsigned) artefact rather than failing.
      #
      # Gatekeeper needs BOTH a Developer ID signature and a notarisation
      # ticket. A signature alone still warns, which is the usual reason
      # somebody concludes signing "did not work".
      - name: Import The Signing Certificate
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          CERTIFICATE_P12: ${{ secrets.PDS__APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.PDS__APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          # A DEDICATED, THROWAWAY KEYCHAIN, not the login one. The runner is
          # ephemeral so it hardly matters here, but it keeps the private key
          # out of any keychain a later step might unlock for another reason,
          # and makes the cleanup below a single delete.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"

          # Without this, codesign blocks on a GUI prompt that nothing on a
          # runner can answer, and the job hangs until it times out rather
          # than failing.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"

          # PREPENDED to the search list rather than replacing it: replacing it
          # removes the system roots, and the certificate chain then fails to
          # validate against an authority the machine can no longer see.
          #
          # The unquoted substitution is REQUIRED, not an oversight — each
          # existing keychain has to arrive as its own argument, and quoting it
          # passes the whole list as one path that does not exist. Hence the
          # disable rather than the fix shellcheck suggests.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Sign The macOS Bundle
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          set -euo pipefail

          # --options runtime is the hardened runtime and is REQUIRED: the
          # notary service rejects anything without it. --timestamp attaches a
          # trusted countersignature, so the signature outlives the
          # certificate instead of expiring with it.
          #
          # No --deep, which Apple has discouraged for years and which signs
          # nested content with the wrong identity as often as the right one.
          # A Wails bundle has one executable, so there is nothing nested to
          # need it.
          #
          # No --entitlements either, and that is deliberate rather than an
          # omission: WKWebView runs JavaScriptCore out-of-process inside
          # Apple's own signed WebContent, so the allow-jit and
          # allow-unsigned-executable-memory entitlements an Electron
          # application needs do not apply here — WKWebView runs it inside
          # Apple's own signed WebContent process, not in ours.
          codesign --force --timestamp --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            build/bin/PodSteer.app

          codesign --verify --strict --verbose=2 build/bin/PodSteer.app

      - name: Notarise The macOS Bundle
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          API_KEY_P8: ${{ secrets.PDS__APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ vars.PDS__APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ vars.PDS__APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/api-key.p8"

          # ditto, NOT zip: the notary service expects this container format,
          # and a plain zip of a bundle loses the symlinks that make the .app
          # openable on the other side.
          ditto -c -k --keepParent build/bin/PodSteer.app "$RUNNER_TEMP/notarize.zip"

          # --wait blocks until Apple has a verdict, so a rejection fails this
          # job rather than shipping an unnotarised build that passes every
          # other check.
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/api-key.p8" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait

          rm -f "$RUNNER_TEMP/api-key.p8" "$RUNNER_TEMP/notarize.zip"

          # STAPLES THE TICKET INTO THE BUNDLE. Without it the application
          # still passes Gatekeeper — but only with a working network, because
          # the ticket is fetched from Apple on first launch. A first launch on
          # a plane, or behind a proxy that blocks Apple, then fails.
          xcrun stapler staple build/bin/PodSteer.app

          # THE GATE, and the only check here that tests what a user's Mac
          # actually does. Everything above can succeed and still produce a
          # bundle Gatekeeper refuses.
          # --type execute, NOT install. `install` is the assessment for an
          # installer package; run against a .app it does not test what
          # Gatekeeper does when somebody double-clicks the application.
          spctl --assess --verbose=4 --type execute build/bin/PodSteer.app

      - name: Remove The Signing Keychain
        # `always()` so the key does not survive a failed signing step. The
        # runner is ephemeral, but a job that leaves secrets behind on the
        # unhappy path is a habit worth not forming.
        if: always() && runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # --- Windows signing ---------------------------------------------------
      #
      # Azure Trusted Signing rather than a certificate from a CA: since June
      # 2023 code-signing keys must live on FIPS-certified hardware, and a USB
      # token cannot be plugged into a hosted runner. The vendor comparison
      # behind that choice is in podsteer/business-docs (private); what matters
      # here is that the signing happens over an API rather than from a device.
      - name: Authenticate To Azure
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          # OIDC federated credentials — GitHub mints a short-lived token per
          # run, so there is no client secret stored in this repository at all.
          client-id: ${{ secrets.PDS__AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PDS__AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PDS__AZURE_SUBSCRIPTION_ID }}

      - name: Sign The Windows Executable
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ secrets.PDS__AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.PDS__AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.PDS__AZURE_SIGNING_PROFILE }}
          files-folder: build/bin
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Compress before upload so the macOS .app keeps its bundle structure and
      # its executable bit; actions/upload-artifact would otherwise flatten it
      # into an unopenable directory tree.
      - name: Archive Artifact
        shell: bash
        run: |
          cd build/bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../../${{ matrix.artifact }}.zip ./*
          else
            zip -r -y ../../${{ matrix.artifact }}.zip ./*
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [quality, bindings, package]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev-')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The SBOM is built once, in the gate, and describes the release rather
      # than any one platform's binary — so it is named for the tag here
      # instead of being regenerated per platform.
      # Artifacts are uploaded under stable names so the matrix does not need
      # the tag; the release is where they gain their version, in one place.
      - name: Version The Release Assets
        run: |
          version="${{ github.ref_name }}"
          mv artifacts/podsteer.cdx.json "artifacts/podsteer_${version}_sbom.cdx.json"
          for f in artifacts/podsteer-*.zip; do
            [ -e "$f" ] || continue
            platform=$(basename "$f" .zip | sed 's/^podsteer-//')
            mv "$f" "artifacts/podsteer_${version}_${platform}.zip"
          done
          ls -la artifacts/

      # A cask and a package manager both need a checksum they did not compute
      # themselves. Published as an asset so it can be fetched without
      # downloading every binary to verify one.
      - name: Checksums
        run: |
          cd artifacts
          shasum -a 256 *.zip > "podsteer_${{ github.ref_name }}_checksums.txt"
          cat "podsteer_${{ github.ref_name }}_checksums.txt"

      # `gh` rather than a third-party release action: it ships on the runner,
      # needs no extra token plumbing, and keeps one less unpinned dependency
      # in the path that produces a signed-off artefact.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref_name }}" == *-rc-* ]]; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE=""
          fi
          gh release create "${{ github.ref_name }}" \
            artifacts/*.zip artifacts/*.cdx.json artifacts/*checksums.txt \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $PRERELEASE

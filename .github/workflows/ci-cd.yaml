name: CI/CD Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc-[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-dev-[0-9]+'
  pull_request:
    branches:
      - 'main'
      - 'develop'

# A desktop application has no environment to deploy into, so the tag tiers
# mean something different here than they do in a ParliTrack service:
#
#   v1.2.3-dev-N   development build — artefacts kept for 14 days, no release
#   v1.2.3-rc-N    release candidate — a GitHub pre-release
#   v1.2.3         production        — a public GitHub release
#
# The branch model and the gate below are unchanged from the service standard.

env:
  GO_VERSION_FILE: go.mod
  NODE_VERSION: '24'
  # Wails v3. Pinned to the exact beta the repository builds against — a beta
  # renames things between releases, and `@latest` here would break a build
  # nobody changed.
  WAILS_VERSION: v3.0.0-beta.16
  # LINUX_TAGS pins v3's GTK3 backend. v3 defaults to gtk4 + webkitgtk-6.0,
  # which Ubuntu 22.04 LTS does not carry at all, so defaulting would drop a
  # distribution PodSteer supports today for no gain the operator can see.
  # v3 ships the gtk3 backend as a first-class build tag against the same
  # gtk+-3.0 and webkit2gtk-4.1 this workflow already installs.
  LINUX_TAGS: gtk3

jobs:
  quality:
    name: Vet, Test, Lint
    runs-on: ubuntu-latest
    # NO `if:` HERE, AND THAT IS THE WHOLE POINT.
    #
    # Every job below declares `needs: quality`, and a SKIPPED dependency skips
    # its dependents. Gate this to branches only and the tag-driven release jobs
    # silently stop — not a failure, no error, just nothing published.
    #
    # This is a release GATE, not a report.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `go build ./...` reaches app/cmd, which imports Wails' application
      # package, which is cgo against GTK and WebKit on Linux. The headers are
      # therefore a prerequisite for the plain Go steps below, not only for the
      # packaging job — v3 moved the window into a package the composition root
      # imports directly, where v2 kept more of it behind the CLI.
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # The embed directory is tracked but empty on a clean checkout, and
      # `//go:embed all:dist` will not compile without an index.html inside it.
      # Building the frontend first is therefore a prerequisite for `go build`,
      # not an optional extra.
      - name: Install Frontend Dependencies
        run: npm --prefix web ci

      - name: Build Frontend
        run: npm --prefix web run build

      - name: Type-check Frontend
        run: npm --prefix web run check

      # Separate from the type check because they catch different things: the
      # type check has never once caught a component that throws when mounted,
      # which is the failure that reached a user.
      - name: Test Frontend
        run: npm --prefix web run test

      # The build scripts have no runner of their own — vitest is scoped to
      # web/ — so this is plain `node:test` and needs nothing installed. It
      # covers the shipped/build/graph-only partition, which decides what the
      # licence gate below classifies at all.
      - name: Test Build Scripts
        run: node --test build/licences/*.test.mjs

      - name: Build
        # The gtk3 tag is why the apt list above is still GTK3 — see LINUX_TAGS.
        run: go build -tags ${{ env.LINUX_TAGS }} ./...

      - name: Vet
        run: go vet -tags ${{ env.LINUX_TAGS }} ./...

      # -race here rather than in a separate job: the Session and the client
      # cache are both shared mutable state reached from concurrent UI calls,
      # which is exactly the class of bug a plain `go test` will not see.
      - name: Test
        run: go test -tags ${{ env.LINUX_TAGS }} -race -count=1 ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          # The linter type-checks, so it needs the same backend tag the build
          # uses or it resolves Wails' Linux files against gtk4 headers that
          # are deliberately not installed. See LINUX_TAGS.
          args: --build-tags ${{ env.LINUX_TAGS }}

      # Inside the gate rather than in a job of its own, deliberately. A
      # separate job would need `needs: quality` and could be skipped
      # independently; here a licence violation stops the release the same way
      # a failing test does.
      #
      # Ordering: this must follow the frontend build, because the generator
      # asks `go list` what the binary links and `//go:embed all:dist` will not
      # evaluate against an empty directory. Following `go build ./...` is for
      # SPEED ONLY — `go list` downloads whatever it lists, so a cold cache
      # costs time and changes nothing. It used to be a correctness
      # requirement, back when build scope meant "present in the module cache"
      # and this job's verdict therefore depended on which job last wrote the
      # shared `setup-go` cache. Scope is membership now; see
      # docs/LICENCE-POLICY.md.
      - name: Verify Licence Policy And Notices
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          node build/generate-notices.mjs
          if ! git -c core.fileMode=false diff --quiet -- app/adapters/notices/notices.json; then
            echo "::error::notices.json is out of date. Run 'make notices' and commit the result."
            git -c core.fileMode=false diff --stat -- app/adapters/notices/notices.json

            # DEPENDABOT ALWAYS LANDS HERE, and unlike the DCO check this one
            # is not exempted — it is the point. A version bump can pull in a
            # transitive dependency under a licence the policy refuses, and
            # regenerating the inventory automatically would wave exactly the
            # change the gate exists to catch straight through. So the failure
            # stands and a maintainer runs the generator, which enforces the
            # policy in the same pass.
            #
            # The note is here because a check that is red by construction gets
            # read as broken, and then ignored.
            if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
              echo "::notice::This is expected on a dependency update: Dependabot cannot run the generator. Apply the bump locally, run 'make notices', and check what it says about any new package before committing."
            fi
            exit 1
          fi
          echo "Licence policy satisfied; notices.json matches the dependency set."

      - name: Generate SBOM
        run: node build/generate-sbom.mjs

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: build/bin/sbom/podsteer.cdx.json
          retention-days: 14
          if-no-files-found: error

  bindings:
    name: Bindings Up To Date
    runs-on: ubuntu-latest
    needs: quality
    # The generated TypeScript in web/src/lib/bindings is committed so that a
    # fresh clone type-checks and IDEs resolve imports without anyone having
    # run Wails. That only stays honest if CI proves it matches the Go it was
    # generated from — otherwise a changed DTO ships a stale frontend contract
    # and nothing notices until runtime.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum

      # Still needed even though nothing is executed here: `wails3 generate
      # bindings` type-checks the packages it scans, and the Linux build of
      # pkg/application is cgo against GTK and WebKit.
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        # The CLI compiles Wails' own packages, so on Linux it needs the same
        # backend tag the application does or it resolves them against gtk4
        # headers this runner deliberately does not install. See LINUX_TAGS.
        run: go install -tags ${{ env.LINUX_TAGS }} github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # Deliberately `make bindings` rather than calling Wails directly: the
      # target also stubs the embed directory (`//go:embed all:dist` will not
      # type-check against an empty one) and normalises the generated files'
      # permission bits. Duplicating that here would let the two drift apart,
      # and this job exists precisely to catch drift.
      #
      # It no longer needs a built frontend, and that is the v3 change: v2
      # generated bindings by compiling AND RUNNING the application, which
      # app/adapters/assets refuses to let start without a real bundle. v3
      # reads the source, so a stub is enough.
      - name: Regenerate Bindings
        run: make bindings

      - name: Fail If Bindings Drifted
        run: |
          # core.fileMode=false so a permission-bit difference between runner
          # and developer machine cannot fail a check about generated content.
          if ! git -c core.fileMode=false diff --quiet -- web/src/lib/bindings; then
            echo "::error::Generated bindings are out of date. Run 'make bindings' and commit the result."
            git -c core.fileMode=false diff --stat -- web/src/lib/bindings
            exit 1
          fi
          echo "Bindings match the bound Go types."

  package:
    name: Package (${{ matrix.name }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    # OIDC, so Azure signing needs no long-lived credential in this repository.
    # `contents: read` is spelled out because naming any permission drops the
    # rest to none, and the default token would otherwise stay read-write.
    permissions:
      contents: read
      id-token: write
    # HOISTED TO THE JOB deliberately. A step's own `env:` block is not visible
    # to that same step's `if:`, so the "skip when unconfigured" conditions
    # below would silently evaluate against an empty string and every signing
    # step would be skipped forever — including after the secrets were added.
    #
    # NOTE THE `vars.` CONTEXT, NOT `secrets.`. The signing identity, key id and
    # issuer id are IDENTIFIERS, not credentials — they are printed inside the
    # certificate itself and are useless without the private key. Holding them
    # as secrets would mask them in the logs as `***`, which makes reading
    # codesign and notarytool output substantially harder for no security gain.
    # Only the .p12, its password and the .p8 are secrets.
    #
    # The GitHub-side names carry the PDS__ prefix; the job-local names do not,
    # because inside this workflow there is nothing to disambiguate from and the
    # shell below reads better without it.
    env:
      APPLE_SIGNING_IDENTITY: ${{ vars.PDS__APPLE_SIGNING_IDENTITY }}
      AZURE_CLIENT_ID: ${{ secrets.PDS__AZURE_CLIENT_ID }}
    strategy:
      # One platform's toolchain breaking should not hide whether the others
      # still package; the release job's `needs` still blocks on all of them.
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than two builds: it is the single
          # URL a Homebrew cask needs, and it works on Intel Macs, which a
          # runner-native arm64 build silently does not.
          - name: macos-universal
            runner: macos-latest
            artifact: podsteer-macos-universal
            platform: darwin/universal
          - name: windows-amd64
            runner: windows-latest
            artifact: podsteer-windows-amd64
          - name: linux-amd64
            runner: ubuntu-latest
            artifact: podsteer-linux-amd64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # Only for `wails3 generate icons`, which renders the .icns and the .ico
      # the packaging step needs. Nothing here compiles through the CLI any
      # more: `make package` is `go build` plus file copies.
      - name: Install Wails CLI
        # The CLI compiles Wails' own packages, so on Linux it needs the same
        # backend tag the application does or it resolves them against gtk4
        # headers that runner deliberately does not install. This job is a
        # platform matrix, so the tag is applied only where it means
        # something. See LINUX_TAGS.
        run: go install ${{ runner.os == 'Linux' && format('-tags {0}', env.LINUX_TAGS) || '' }} github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # `//go:embed all:dist` needs a real bundle before the Go build, so the
      # frontend is built first. That was true under v2 as well; what is gone
      # is the second reason — binding generation no longer runs the binary.
      - name: Build Frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build

      # `make package` rather than `make build`: the licence gate and the
      # frontend build are the two things `build` adds, and both have already
      # run — the gate once, in `quality`, rather than three more times across
      # this matrix. The Makefile owns the compile flags, the bundle layout and
      # the .app's capitalised name, so this job and a developer's machine
      # cannot produce different artefacts.
      - name: Build Application
        run: make package
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          PLATFORM: ${{ matrix.platform }}

      # --- macOS signing and notarisation -----------------------------------
      #
      # SKIPPED ENTIRELY UNTIL THE SECRETS EXIST, so this can be merged before
      # the Apple enrolment completes and a build on an unconfigured fork still
      # produces an (unsigned) artefact rather than failing.
      #
      # Gatekeeper needs BOTH a Developer ID signature and a notarisation
      # ticket. A signature alone still warns, which is the usual reason
      # somebody concludes signing "did not work".
      - name: Import The Signing Certificate
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          CERTIFICATE_P12: ${{ secrets.PDS__APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.PDS__APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          # A DEDICATED, THROWAWAY KEYCHAIN, not the login one. The runner is
          # ephemeral so it hardly matters here, but it keeps the private key
          # out of any keychain a later step might unlock for another reason,
          # and makes the cleanup below a single delete.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"

          # Without this, codesign blocks on a GUI prompt that nothing on a
          # runner can answer, and the job hangs until it times out rather
          # than failing.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"

          # PREPENDED to the search list rather than replacing it: replacing it
          # removes the system roots, and the certificate chain then fails to
          # validate against an authority the machine can no longer see.
          #
          # The unquoted substitution is REQUIRED, not an oversight — each
          # existing keychain has to arrive as its own argument, and quoting it
          # passes the whole list as one path that does not exist. Hence the
          # disable rather than the fix shellcheck suggests.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Sign The macOS Bundle
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          set -euo pipefail

          # --options runtime is the hardened runtime and is REQUIRED: the
          # notary service rejects anything without it. --timestamp attaches a
          # trusted countersignature, so the signature outlives the
          # certificate instead of expiring with it.
          #
          # No --deep, which Apple has discouraged for years and which signs
          # nested content with the wrong identity as often as the right one.
          # A Wails bundle has one executable, so there is nothing nested to
          # need it.
          #
          # No --entitlements either, and that is deliberate rather than an
          # omission: WKWebView runs JavaScriptCore out-of-process inside
          # Apple's own signed WebContent, so the allow-jit and
          # allow-unsigned-executable-memory entitlements an Electron
          # application needs do not apply here — WKWebView runs it inside
          # Apple's own signed WebContent process, not in ours.
          codesign --force --timestamp --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            build/bin/PodSteer.app

          codesign --verify --strict --verbose=2 build/bin/PodSteer.app

      - name: Notarise The macOS Bundle
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          API_KEY_P8: ${{ secrets.PDS__APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ vars.PDS__APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ vars.PDS__APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/api-key.p8"

          # ditto, NOT zip: the notary service expects this container format,
          # and a plain zip of a bundle loses the symlinks that make the .app
          # openable on the other side.
          ditto -c -k --keepParent build/bin/PodSteer.app "$RUNNER_TEMP/notarize.zip"

          # The submission, its timeout and its retry policy all live in
          # build/notarise.sh, because a release makes TWO of them now — this
          # bundle and the disk image wrapping it — and Apple's notary service
          # is unreliable enough that the difference between "Apple said no"
          # and "Apple did not answer" has to be made in one place. See that
          # script for why a rejection is never retried.
          API_KEY_PATH="$RUNNER_TEMP/api-key.p8" build/notarise.sh "$RUNNER_TEMP/notarize.zip"

          rm -f "$RUNNER_TEMP/api-key.p8" "$RUNNER_TEMP/notarize.zip"

          # STAPLES THE TICKET INTO THE BUNDLE. Without it the application
          # still passes Gatekeeper — but only with a working network, because
          # the ticket is fetched from Apple on first launch. A first launch on
          # a plane, or behind a proxy that blocks Apple, then fails.
          xcrun stapler staple build/bin/PodSteer.app

          # THE GATE, and the only check here that tests what a user's Mac
          # actually does. Everything above can succeed and still produce a
          # bundle Gatekeeper refuses.
          # --type execute, NOT install. `install` is the assessment for an
          # installer package; run against a .app it does not test what
          # Gatekeeper does when somebody double-clicks the application.
          spctl --assess --verbose=4 --type execute build/bin/PodSteer.app

      # --- The macOS disk image ---------------------------------------------
      #
      # A .dmg BECAUSE THE WEBSITE NEEDS SOMETHING TO LINK TO. The zip below
      # is what the Homebrew cask consumes and is not going anywhere; it is
      # also the wrong thing to hand somebody who arrived from podsteer.com,
      # because unzipping produces a .app in ~/Downloads that most people then
      # run from there for ever. A disk image with an /Applications symlink is
      # the gesture macOS taught everybody, and it puts the application where
      # it belongs.
      #
      # ONE UNIVERSAL IMAGE RATHER THAN ONE PER ARCHITECTURE, and the reason is
      # specific to macOS: browsers on Apple Silicon report `Intel Mac OS X` in
      # the user-agent for compatibility, so a download page CANNOT reliably
      # detect the visitor's chip. Splitting would mean asking people to know
      # their own processor, and the failure mode is an application that will
      # not launch at all. It costs roughly twice the download.
      #
      # Built unsigned too, on every branch build, so this path is exercised
      # long before a release depends on it.
      - name: Build The macOS Disk Image
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail

          staging="$RUNNER_TEMP/dmg"
          rm -rf "$staging"
          mkdir -p "$staging"

          # ditto, NOT cp: it is the tool that understands bundles, and a
          # signed .app copied with anything less careful can arrive with its
          # signature broken by a lost extended attribute — which shows up as
          # Gatekeeper refusing the application, not as an error here.
          ditto build/bin/PodSteer.app "$staging/PodSteer.app"

          # THE GESTURE THE WHOLE IMAGE EXISTS FOR. Without this symlink the
          # window offers nowhere to drag to, and the .app gets run from the
          # mounted volume — which works until the volume is ejected.
          ln -s /Applications "$staging/Applications"

          hdiutil create \
            -volname "PodSteer" \
            -srcfolder "$staging" \
            -fs HFS+ \
            -format UDZO \
            -ov \
            build/bin/PodSteer.dmg

          rm -rf "$staging"

      - name: Sign And Notarise The macOS Disk Image
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          API_KEY_P8: ${{ secrets.PDS__APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ vars.PDS__APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ vars.PDS__APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          # THE CONTAINER IS ASSESSED IN ITS OWN RIGHT, which is the part that
          # is easy to get wrong: an unsigned disk image wrapping a perfectly
          # notarised application still makes Gatekeeper complain, because what
          # the user double-clicks first is the image. The .app inside was
          # signed, notarised and stapled by the steps above, so this is the
          # second half of the same job rather than a repeat of it.
          #
          # No --options runtime here. The hardened runtime is a property of an
          # executable's process, and a disk image does not have one.
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" build/bin/PodSteer.dmg
          codesign --verify --strict --verbose=2 build/bin/PodSteer.dmg

          echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/api-key.p8"

          # Submitted directly: notarytool takes a .dmg as-is, unlike the .app
          # above which had to be wrapped first.
          #
          # THIS IS THE SUBMISSION THAT PROVED THE RETRY NECESSARY. Its first
          # run met a bare 504 from Apple's front door fifteen seconds after
          # the bundle above had notarised successfully with the same
          # credentials — a perfectly good release failed by somebody else's
          # gateway.
          API_KEY_PATH="$RUNNER_TEMP/api-key.p8" build/notarise.sh build/bin/PodSteer.dmg

          rm -f "$RUNNER_TEMP/api-key.p8"

          xcrun stapler staple build/bin/PodSteer.dmg

          # --type open --context context:primary-signature is the assessment
          # for a DISK IMAGE. `--type execute`, which is right for the .app,
          # reports an image as rejected whatever its state, so using it here
          # would fail every release for no reason.
          spctl --assess --verbose=4 --type open \
            --context context:primary-signature build/bin/PodSteer.dmg

      - name: Remove The Signing Keychain
        # `always()` so the key does not survive a failed signing step. The
        # runner is ephemeral, but a job that leaves secrets behind on the
        # unhappy path is a habit worth not forming.
        if: always() && runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # --- Windows signing ---------------------------------------------------
      #
      # Azure Trusted Signing rather than a certificate from a CA: since June
      # 2023 code-signing keys must live on FIPS-certified hardware, and a USB
      # token cannot be plugged into a hosted runner. The vendor comparison
      # behind that choice is in podsteer/business-docs (private); what matters
      # here is that the signing happens over an API rather than from a device.
      - name: Authenticate To Azure
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          # OIDC federated credentials — GitHub mints a short-lived token per
          # run, so there is no client secret stored in this repository at all.
          client-id: ${{ secrets.PDS__AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PDS__AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PDS__AZURE_SUBSCRIPTION_ID }}

      - name: Sign The Windows Executable
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        # v2, and the input names were checked against the action's own schema
        # rather than assumed: this step is gated on AZURE_CLIENT_ID and so
        # never runs in CI, which means a renamed input would not surface until
        # the first Windows release actually signs something. v2 did rename one
        # — `code-signing-account-name` to `signing-account-name` — but not any
        # of the eight used here.
        uses: azure/trusted-signing-action@v2
        with:
          endpoint: ${{ secrets.PDS__AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.PDS__AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.PDS__AZURE_SIGNING_PROFILE }}
          files-folder: build/bin
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Compress before upload so the macOS .app keeps its bundle structure and
      # its executable bit; actions/upload-artifact would otherwise flatten it
      # into an unopenable directory tree.
      # The disk image is EXCLUDED from the zip. It is a separate release
      # asset, and a zip that also contained it would double every macOS
      # download for people who only wanted one of the two.
      - name: Archive Artifact
        shell: bash
        run: |
          cd build/bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../../${{ matrix.artifact }}.zip ./*
          else
            zip -r -y ../../${{ matrix.artifact }}.zip ./* -x '*.dmg'
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 14
          if-no-files-found: error

      # Its own upload rather than a second path on the one above, because
      # `if-no-files-found: error` is worth keeping and the image exists on
      # exactly one runner.
      - name: Upload The macOS Disk Image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-dmg
          path: build/bin/PodSteer.dmg
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [quality, bindings, package]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev-')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The SBOM is built once, in the gate, and describes the release rather
      # than any one platform's binary — so it is named for the tag here
      # instead of being regenerated per platform.
      # Artifacts are uploaded under stable names so the matrix does not need
      # the tag; the release is where they gain their version, in one place.
      - name: Version The Release Assets
        run: |
          version="${{ github.ref_name }}"
          mv artifacts/podsteer.cdx.json "artifacts/podsteer_${version}_sbom.cdx.json"
          for f in artifacts/podsteer-*.zip; do
            [ -e "$f" ] || continue
            platform=$(basename "$f" .zip | sed 's/^podsteer-//')
            mv "$f" "artifacts/podsteer_${version}_${platform}.zip"
          done
          # THE SAME NAMING AS THE ZIPS, and podsteer.com composes this string
          # itself — see `Release.AssetName` there, and the test named
          # TestAssetNameMatchesWhatCIPublishes, which exists because GitHub's
          # /releases/latest/download/<name> redirect matches an asset by its
          # exact name. A change here that is not made there produces download
          # buttons that 404 against a real release.
          if [ -e artifacts/PodSteer.dmg ]; then
            mv artifacts/PodSteer.dmg "artifacts/podsteer_${version}_macos-universal.dmg"
          fi
          ls -la artifacts/

      # A cask and a package manager both need a checksum they did not compute
      # themselves. Published as an asset so it can be fetched without
      # downloading every binary to verify one.
      - name: Checksums
        run: |
          cd artifacts
          # The disk image is checksummed too: it is the asset most people
          # will actually download, and "verify what you downloaded" is not
          # advice that should apply to only some of the downloads.
          shasum -a 256 *.zip *.dmg > "podsteer_${{ github.ref_name }}_checksums.txt"
          cat "podsteer_${{ github.ref_name }}_checksums.txt"

      # `gh` rather than a third-party release action: it ships on the runner,
      # needs no extra token plumbing, and keeps one less unpinned dependency
      # in the path that produces a signed-off artefact.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref_name }}" == *-rc-* ]]; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE=""
          fi
          gh release create "${{ github.ref_name }}" \
            artifacts/*.zip artifacts/*.dmg artifacts/*.cdx.json artifacts/*checksums.txt \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $PRERELEASE

  # THE TAP IS CALLED, NOT LEFT TO REACT.
  #
  # homebrew.yaml carries a `release: published` trigger that looks sufficient
  # and is not: the release above is created with GITHUB_TOKEN, and GitHub does
  # not start workflows from events raised by that token. The event never
  # arrives. v0.1.0 published with the cask untouched, silently, and had to be
  # dispatched by hand — the exact shape of quiet breakage the rest of this
  # pipeline exists to avoid.
  #
  # Calling it keeps the credential situation unchanged: the App token is still
  # minted inside that workflow and still scoped to the tap repository alone.
  # Nothing here gains write access to anything it did not already have.
  #
  # `needs: release` is what makes the checksum honest. The cask is verified
  # against the bytes GitHub actually serves, which only exist once the release
  # job has finished uploading them.
  tap:
    name: Update Homebrew Tap
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev-')
    uses: ./.github/workflows/homebrew.yaml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

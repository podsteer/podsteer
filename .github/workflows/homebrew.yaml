name: Update Homebrew Tap

# Rewrites the cask in podsteer/homebrew-tap after a production release, so
# `brew install --cask podsteer` serves the version that was just published.
#
# Separate from ci-cd.yaml because it is a distinct concern, but CALLED by it
# rather than left to react on its own. The `release: published` trigger below
# looks like it should be enough and is not: the release is created by a
# workflow using GITHUB_TOKEN, and GitHub deliberately does not start workflows
# from events raised by that token — an anti-recursion rule with no exception
# for this case. So the event never arrived, the tap was never updated, and
# nothing failed to say so. v0.1.0 shipped with the cask untouched until it was
# dispatched by hand.
#
# The trigger is kept anyway: it costs nothing, and it works for a release
# published by a human or by anything holding a non-GITHUB_TOKEN credential.
# The workflow_call path is the one the pipeline actually relies on.
#
# Still a separate JOB from the release rather than a step inside it, which was
# the original reason for the separation and remains right: the checksum has to
# be computed from the asset as GitHub serves it, and that is only true once
# the release job has finished uploading. `needs: release` guarantees that;
# folding it into the release job itself would race the upload.
#
# Production tags only. A -dev- or -rc- build is not something anyone should
# get from `brew install`.

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to publish to the tap, e.g. v1.2.3'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to the tap, e.g. v1.2.3'
        required: true
        type: string

permissions:
  contents: read

jobs:
  cask:
    name: Publish Cask
    runs-on: ubuntu-latest
    steps:
      - name: Resolve The Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `inputs.tag` is set for both workflow_call and workflow_dispatch;
          # the event payload covers a release published by something other
          # than GITHUB_TOKEN.
          tag="${{ inputs.tag || github.event.release.tag_name }}"

          # Pre-releases and development builds are not what `brew install`
          # should hand somebody.
          case "$tag" in
            *-dev-*|*-rc-*)
              echo "::notice::$tag is a pre-release; the tap serves production tags only."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          version="${tag#v}"
          asset="podsteer_${tag}_macos-universal.zip"
          url="https://github.com/${{ github.repository }}/releases/download/${tag}/${asset}"

          # Downloaded rather than read from the checksums asset: the point is
          # to checksum the bytes Homebrew will actually fetch from this URL,
          # not to repeat a number computed elsewhere.
          echo "Downloading $url"
          curl -fsSL --retry 3 --retry-delay 5 -o "$asset" "$url"
          sha256=$(sha256sum "$asset" | cut -d' ' -f1)

          # THE CASK'S macOS FLOOR IS DERIVED, not maintained by hand, for the
          # reason `version` and `sha256` are: a number a human has to remember
          # to change is one that goes stale, and this one already did. It read
          # `">= :high_sierra"` — macOS 10.13 — for long enough to be corrected
          # by hand once, and the application's floor has moved twice since.
          #
          # Read from LSMinimumSystemVersion in the bundle Homebrew is about to
          # serve, which is the same number LaunchServices reads before opening
          # it. The application's own build asserts that plist against the
          # lowest slice of its binary ("Verify The macOS Minimum Is Stated
          # Once" in ci-cd.yaml), so trusting it here needs no Mach-O parsing
          # on a Linux runner.
          #
          # plistlib rather than a grep: it reads the binary plist format too,
          # so a future build that ships one does not silently produce an empty
          # match and a cask claiming whatever the fallback was.
          #
          # The format is chosen rather than sniffed, and that is not padding.
          # plistlib decides by looking for an `<?xml` declaration, and every
          # bundle PodSteer shipped up to v0.2.0 began at `<!DOCTYPE` instead,
          # which it rejects outright. The declaration is there from this
          # release on; choosing the format keeps this readable against the
          # artefacts that already exist, which is the only way to test it.
          minimum=$(unzip -p "$asset" "PodSteer.app/Contents/Info.plist" | python3 -c 'import plistlib, sys; raw = sys.stdin.buffer.read(); fmt = plistlib.FMT_XML if raw.lstrip()[:1] == b"<" else plistlib.FMT_BINARY; print(plistlib.loads(raw, fmt=fmt)["LSMinimumSystemVersion"])')
          major=${minimum%%.*}

          # AN EXPLICIT TABLE THAT FAILS ON A MISS, rather than a default. A
          # wrong symbol here is a cask that installs onto machines which
          # cannot run the application, which is the exact failure this exists
          # to stop — so an unrecognised version stops the release instead.
          # macOS numbering jumps from 15 to 26; 16 to 25 are not versions.
          case "$major" in
            11) macos_symbol="big_sur" ;;
            12) macos_symbol="monterey" ;;
            13) macos_symbol="ventura" ;;
            14) macos_symbol="sonoma" ;;
            15) macos_symbol="sequoia" ;;
            26) macos_symbol="tahoe" ;;
            *)
              echo "::error::No Homebrew symbol known for macOS $minimum (major $major)."
              echo "::error::Add it to the table in this workflow rather than guessing."
              exit 1
              ;;
          esac
          echo "The bundle declares macOS $minimum, which is :$macos_symbol"

          {
            echo "skip=false"
            echo "tag=$tag"
            echo "version=$version"
            echo "sha256=$sha256"
            echo "macos_symbol=$macos_symbol"
          } >> "$GITHUB_OUTPUT"

      # A GITHUB APP RATHER THAN A PERSONAL ACCESS TOKEN, and the reason is the
      # failure mode rather than the threat model.
      #
      # GITHUB_TOKEN is scoped to THIS repository and cannot push to another
      # one — which is the usual reason a workflow like this silently does
      # nothing — so some second credential is required. A fine-grained PAT
      # would work and takes five minutes, but it EXPIRES: a year from now a
      # release would publish, this job would fail to check out the tap, and
      # `brew install --cask podsteer` would quietly keep serving the previous
      # version until a user complained. That is exactly the shape of silent
      # breakage the rest of this pipeline is built to avoid.
      #
      # An App installation has no expiry. The token minted below lives one
      # hour, is scoped to the single repository the App is installed on, and
      # belongs to the organisation rather than to a person — so it survives
      # anyone leaving, and there is no long-lived credential at rest.
      - name: Mint A Tap Token
        id: tap-token
        if: steps.release.outputs.skip == 'false'
        uses: actions/create-github-app-token@v3
        with:
          # `app-id` still works in v3 but is deprecated in favour of
          # `client-id`, which is a DIFFERENT value from the App ID and would
          # need a new repository variable. Left as it is deliberately rather
          # than swapped blind: getting it wrong breaks the tap update, and
          # that failure is invisible until somebody runs `brew upgrade`.
          app-id: ${{ vars.PDS__TAP_APP_ID }}
          private-key: ${{ secrets.PDS__TAP_APP_PRIVATE_KEY }}
          owner: podsteer
          repositories: homebrew-tap

      - name: Check Out The Tap
        if: steps.release.outputs.skip == 'false'
        uses: actions/checkout@v7
        with:
          repository: podsteer/homebrew-tap
          # actions/checkout leaves this token in the checkout's credential
          # helper, which is what lets the `git push` at the end of this job
          # authenticate without handling it again.
          token: ${{ steps.tap-token.outputs.token }}
          path: tap

      - name: Rewrite The Cask
        if: steps.release.outputs.skip == 'false'
        run: |
          cask=tap/Casks/podsteer.rb
          # Only the three lines that change per release. A regenerated file
          # would drop the caveats and the zap list, which are prose rather
          # than release metadata.
          sed -i -E \
            -e 's|^  version ".*"$|  version "${{ steps.release.outputs.version }}"|' \
            -e 's|^  sha256 ".*"$|  sha256 "${{ steps.release.outputs.sha256 }}"|' \
            -e 's|^  depends_on macos: :.*$|  depends_on macos: :${{ steps.release.outputs.macos_symbol }}|' \
            "$cask"

          # A rewrite that matched nothing is a rewrite that did not happen,
          # and the cask would ship the previous floor without saying so.
          if ! grep -q '^  depends_on macos: :${{ steps.release.outputs.macos_symbol }}$' "$cask"; then
            echo "::error::The depends_on line was not rewritten; the cask's shape must have changed."
            exit 1
          fi
          git -C tap diff -- Casks/podsteer.rb

      - name: Verify The Cask Still Parses
        if: steps.release.outputs.skip == 'false'
        run: ruby -c tap/Casks/podsteer.rb

      - name: Commit
        if: steps.release.outputs.skip == 'false'
        working-directory: tap
        run: |
          if git diff --quiet -- Casks/podsteer.rb; then
            echo "::notice::The cask already describes ${{ steps.release.outputs.tag }}."
            exit 0
          fi
          git config user.name  "podsteer-bot"
          git config user.email "bot@podsteer.com"
          git add Casks/podsteer.rb
          git commit -m "podsteer ${{ steps.release.outputs.version }}"
          git push

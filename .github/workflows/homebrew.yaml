name: Update Homebrew Tap

# Rewrites the cask in podsteer/homebrew-tap after a production release, so
# `brew install --cask podsteer` serves the version that was just published.
#
# Separate from ci-cd.yaml deliberately. That workflow's release job builds and
# publishes; this one reacts to a release having been published, which is the
# only moment the download URL and its checksum both exist. Folding it in would
# mean computing a checksum for an asset GitHub had not finished storing.
#
# Production tags only. A -dev- or -rc- build is not something anyone should
# get from `brew install`.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to the tap, e.g. v1.2.3'
        required: true

permissions:
  contents: read

jobs:
  cask:
    name: Publish Cask
    runs-on: ubuntu-latest
    steps:
      - name: Resolve The Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag || github.event.release.tag_name }}"

          # Pre-releases and development builds are not what `brew install`
          # should hand somebody.
          case "$tag" in
            *-dev-*|*-rc-*)
              echo "::notice::$tag is a pre-release; the tap serves production tags only."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          version="${tag#v}"
          asset="podsteer_${tag}_macos-universal.zip"
          url="https://github.com/${{ github.repository }}/releases/download/${tag}/${asset}"

          # Downloaded rather than read from the checksums asset: the point is
          # to checksum the bytes Homebrew will actually fetch from this URL,
          # not to repeat a number computed elsewhere.
          echo "Downloading $url"
          curl -fsSL --retry 3 --retry-delay 5 -o "$asset" "$url"
          sha256=$(sha256sum "$asset" | cut -d' ' -f1)

          {
            echo "skip=false"
            echo "tag=$tag"
            echo "version=$version"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      # A GITHUB APP RATHER THAN A PERSONAL ACCESS TOKEN, and the reason is the
      # failure mode rather than the threat model.
      #
      # GITHUB_TOKEN is scoped to THIS repository and cannot push to another
      # one — which is the usual reason a workflow like this silently does
      # nothing — so some second credential is required. A fine-grained PAT
      # would work and takes five minutes, but it EXPIRES: a year from now a
      # release would publish, this job would fail to check out the tap, and
      # `brew install --cask podsteer` would quietly keep serving the previous
      # version until a user complained. That is exactly the shape of silent
      # breakage the rest of this pipeline is built to avoid.
      #
      # An App installation has no expiry. The token minted below lives one
      # hour, is scoped to the single repository the App is installed on, and
      # belongs to the organisation rather than to a person — so it survives
      # anyone leaving, and there is no long-lived credential at rest.
      - name: Mint A Tap Token
        id: tap-token
        if: steps.release.outputs.skip == 'false'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PDS__TAP_APP_ID }}
          private-key: ${{ secrets.PDS__TAP_APP_PRIVATE_KEY }}
          owner: podsteer
          repositories: homebrew-tap

      - name: Check Out The Tap
        if: steps.release.outputs.skip == 'false'
        uses: actions/checkout@v7
        with:
          repository: podsteer/homebrew-tap
          # actions/checkout leaves this token in the checkout's credential
          # helper, which is what lets the `git push` at the end of this job
          # authenticate without handling it again.
          token: ${{ steps.tap-token.outputs.token }}
          path: tap

      - name: Rewrite The Cask
        if: steps.release.outputs.skip == 'false'
        run: |
          cask=tap/Casks/podsteer.rb
          # Only the two lines that change per release. A regenerated file
          # would drop the caveats and the zap list, which are prose rather
          # than release metadata.
          sed -i -E \
            -e 's|^  version ".*"$|  version "${{ steps.release.outputs.version }}"|' \
            -e 's|^  sha256 ".*"$|  sha256 "${{ steps.release.outputs.sha256 }}"|' \
            "$cask"
          git -C tap diff -- Casks/podsteer.rb

      - name: Verify The Cask Still Parses
        if: steps.release.outputs.skip == 'false'
        run: ruby -c tap/Casks/podsteer.rb

      - name: Commit
        if: steps.release.outputs.skip == 'false'
        working-directory: tap
        run: |
          if git diff --quiet -- Casks/podsteer.rb; then
            echo "::notice::The cask already describes ${{ steps.release.outputs.tag }}."
            exit 0
          fi
          git config user.name  "podsteer-bot"
          git config user.email "bot@podsteer.com"
          git add Casks/podsteer.rb
          git commit -m "podsteer ${{ steps.release.outputs.version }}"
          git push

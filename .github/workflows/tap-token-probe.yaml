# TEMPORARY. Proves the tap App can mint a token and write to the tap, without
# needing a release to exist. Deleted before this branch merges.
#
# `on: push` to this branch specifically, because workflow_dispatch only becomes
# triggerable once the workflow is on the default branch — which is exactly what
# we are trying to avoid doing before it is known to work.
name: Tap Token Probe
on:
  push:
    branches: [ci/tap-token-via-github-app]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Mint A Tap Token
        id: tap-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PDS__TAP_APP_ID }}
          private-key: ${{ secrets.PDS__TAP_APP_PRIVATE_KEY }}
          owner: podsteer
          repositories: homebrew-tap

      - name: What Can This Token Reach
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "--- repositories the installation grants ---"
          gh api installation/repositories --jq '.repositories[].full_name'
          echo
          echo "--- can it read the tap? ---"
          gh api repos/podsteer/homebrew-tap --jq '"\(.full_name) (\(.visibility))"'
          echo
          echo "--- current Casks/ contents ---"
          gh api repos/podsteer/homebrew-tap/contents/Casks --jq '.[].name' 2>&1 || echo "(empty or missing)"
          echo
          echo "--- can it reach the APPLICATION repo? (it must NOT) ---"
          if gh api repos/podsteer/podsteer --silent 2>/dev/null; then
            echo "::error::the token can read podsteer/podsteer — scope is too broad"
            exit 1
          else
            echo "correctly denied"
          fi

      - name: Prove It Can Actually Push
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/podsteer/homebrew-tap.git" tap
          cd tap
          git config user.name "podsteer-bot"
          git config user.email "bot@podsteer.com"
          date -u +"probe %Y-%m-%dT%H:%M:%SZ" > .tap-token-probe
          git add .tap-token-probe
          git commit -m "chore: tap token probe [skip ci]"
          git push
          echo "PUSH SUCCEEDED"
          # Immediately undo it — this is a permission test, not a change.
          git rm -q .tap-token-probe
          git commit -q -m "chore: remove tap token probe [skip ci]"
          git push
          echo "CLEANUP PUSHED"

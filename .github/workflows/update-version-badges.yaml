name: Update Version Badges

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    strategy:
      # Both long-lived branches carry the badges, so a reader lands on current
      # version information whichever one GitHub shows them.
      matrix:
        branch: [main, develop]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Tags are what the script reads; a shallow clone would not have them.
          fetch-depth: 0

      - name: Run badge generation script
        run: |
          chmod +x ./build/generate-badges.sh
          ./build/generate-badges.sh

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          # -s, SO THE RELEASE PULL REQUEST CAN PASS. This commit lands on
          # `develop` and `main`, so it is inside the range every develop →
          # main pull request is checked over — and dco.yaml compares each
          # commit's Signed-off-by against its own AUTHOR. Unsigned, it made
          # every future release pull request fail by construction, on a
          # commit that changed a badge URL.
          #
          # Signed off here rather than exempted there, deliberately. An
          # exemption would have to match on the commit's author email, and
          # that is just text in the object — anybody can set it to this one.
          # dco.yaml says exactly that about its dependabot exemption, which
          # is why that one is gated on who opened the pull request instead.
          # Signing off at the point of creation needs no exemption and opens
          # no hole: the identity below is the author, so the trailer and the
          # author agree by construction.
          #
          # [skip ci] matters: without it this push re-triggers the pipeline on
          # a commit that changed nothing but a badge URL.
          git commit -s -m "Update version badges [skip ci]"
          git push origin ${{ matrix.branch }}
